name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      

      - name: 给 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: 重命名 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk \
             out/encryptionHelper-${GITHUB_REF_NAME}.apk

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/encryptionHelper-*.apk
          generate_release_notes: true